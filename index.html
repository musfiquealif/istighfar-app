<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Istighfar">
<meta name="theme-color" content="#0a0e0d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Istighfar</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#f2f2f7;--text:#000;--sub:#8a8a8e;--ring:#12b886;--track:#12b88626;--bar:#12b886;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--text:#fff;--sub:#8e8e93;--ring:#2de2a6;--track:#2de2a62e;--bar:#2de2a6}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--text:#fff;--sub:#8e8e93;--ring:#2de2a6;--track:#2de2a62e;--bar:#2de2a6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;min-height:100%}
#app{max-width:480px;margin:0 auto;padding:16px 18px 32px;min-height:100vh;display:flex;flex-direction:column}
h1{font-size:32px;margin:6px 0 2px;font-weight:700;letter-spacing:-.5px}
.date{color:var(--sub);font-size:15px;margin-bottom:14px}
.tabs{display:flex;background:var(--card);border-radius:10px;padding:2px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:none;color:var(--text);font:600 14px inherit;font-family:inherit;padding:7px 0;border-radius:8px;cursor:pointer}
.tabs button.on{background:var(--bg);box-shadow:0 1px 3px #0003}
:root:not([data-theme="light"]) .tabs button.on{background:#636366}
.tapzone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0 18px;cursor:pointer;touch-action:manipulation}
.bigring{position:relative;width:280px;height:280px;transition:transform .12s}
.bigring.p{transform:scale(.97)}
.bigring svg{display:block}
.arc{transition:stroke-dashoffset .35s cubic-bezier(.3,.9,.3,1)}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.num{font-size:80px;font-weight:700;letter-spacing:-2px;font-variant-numeric:tabular-nums;line-height:1}
.of{color:var(--sub);font-size:15px;margin-top:6px}
.ar{font-family:Amiri,"Noto Naskh Arabic","Geeza Pro",serif;font-size:34px;margin-top:22px;color:var(--ring);direction:rtl}
.hint{color:var(--sub);font-size:13px;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border-radius:16px;padding:12px}
.tile small{display:block;color:var(--sub);font-size:12px;font-weight:600;margin-bottom:4px}
.tile b{font-size:22px;font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;justify-content:space-between}
.step button,.undo,.nav button{border:0;background:var(--track);color:var(--ring);width:28px;height:28px;border-radius:14px;font:700 18px inherit;font-family:inherit;cursor:pointer;line-height:1}
.undo{width:auto;padding:0 14px;height:36px;border-radius:18px;font-size:14px;font-weight:600;margin:12px auto 0;display:block}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav span{font-weight:600;font-size:17px}
.big{font-size:44px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.big small{font-size:16px;color:var(--sub);font-weight:600;letter-spacing:0;margin-left:4px}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wk .d{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--sub);font-weight:600}
.wk .d.today .l{color:var(--ring)}
.wk .c{font-size:12px;color:var(--text);font-variant-numeric:tabular-nums}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:120px;align-items:end;margin-top:6px}
.bars div{background:var(--bar);border-radius:6px;min-height:4px;opacity:.9}
.bars div.z{background:var(--track)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 2px;justify-items:center}
.cal .h{font-size:11px;color:var(--sub);font-weight:600}
.cal .d{position:relative;width:36px;height:36px}
.cal .d span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.cal .d.today span{color:var(--ring)}
.cal .d.fut{opacity:.35}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum .tile b{font-size:20px}
.f{width:100%;padding:12px;border-radius:12px;border:0;background:var(--bg);color:var(--text);font-size:16px;font-family:inherit;margin:6px 0;user-select:text;-webkit-user-select:text;outline:0}
.pb{background:var(--ring);color:#04130e;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;font-family:inherit;cursor:pointer;margin-top:6px}
.lk{background:none;border:0;color:var(--ring);font-weight:600;font-size:14px;font-family:inherit;cursor:pointer;padding:6px 0}
.row{display:flex;gap:8px;align-items:center}.row .pb{margin-top:0;flex:none}
.lb{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--track);font-variant-numeric:tabular-nums}.lb.me{color:var(--ring);font-weight:700}
.sub{color:var(--sub);font-size:14px;margin:4px 0 10px}
.ok{color:var(--ring);font-size:14px;font-weight:600;margin-top:8px;height:18px}
.tile input{width:100%;font:700 22px inherit;font-family:inherit;color:var(--ring);background:none;border:0;border-bottom:2px solid var(--track);padding:0 0 2px;outline:0;border-radius:0;user-select:text;-webkit-user-select:text;font-variant-numeric:tabular-nums}
.tile input:focus{border-bottom-color:var(--ring)}
@media (prefers-reduced-motion:reduce){.arc,.bigring{transition:none}}
</style>
</head>
<body>
<div id="app">
  <h1>Istighfar</h1>
  <div class="date" id="date"></div>
  <div class="tabs" id="tabs">
    <button data-v="day" class="on">Day</button><button data-v="week">Week</button><button data-v="month">Month</button><button data-v="friends">Friends</button>
  </div>
  <div id="content" style="flex:1;display:flex;flex-direction:column"></div>
</div>
<script>
var K='istighfar-v1',S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S&&S.days?S:{days:{},goal:100};
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function pad(n){return String(n).padStart(2,'0')}
function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function cnt(d){return S.days[key(d)]||0}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
var TODAY=new Date();TODAY.setHours(0,0,0,0);
var view='day',off=0;
var WD=['Sat','Sun','Mon','Tue','Wed','Thu','Fri'];
var MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
var $=function(id){return document.getElementById(id)};
function fmt(n){return n.toLocaleString('en-US')}

function ring(p,sz,sw){
  var r=(sz-sw)/2,c=2*Math.PI*r,h=sz/2;
  return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 '+sz+' '+sz+'">'+
  '<circle cx="'+h+'" cy="'+h+'" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="'+sw+'"/>'+
  '<circle class="arc" id="'+(sz>200?'arc':'')+'" cx="'+h+'" cy="'+h+'" r="'+r+'" fill="none" stroke="var(--ring)" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-Math.min(p,1)))+'" transform="rotate(-90 '+h+' '+h+')" opacity="'+(p>0?1:0)+'"/></svg>';
}
function streak(){
  var n=0,d=new Date(TODAY);
  if(cnt(d)<S.goal)d=addDays(d,-1);
  while(cnt(d)>=S.goal&&S.goal>0){n++;d=addDays(d,-1)}
  return n;
}
function total(){var t=0;for(var k in S.days)t+=S.days[k];return t}

/* ---------- DAY ---------- */
var CIRC=0;
function renderDay(){
  $('content').innerHTML=
  '<div class="tapzone" id="zone">'+
    '<div class="bigring" id="br">'+ring(0,280,30)+
      '<div class="center"><div class="num" id="num">0</div><div class="of" id="of"></div></div></div>'+
    '<div class="ar">أَسْتَغْفِرُ ٱللَّٰهَ</div>'+
    '<div class="ok" id="ok"></div>'+
    '<div class="hint">Tap anywhere to count</div>'+
  '</div>'+
  '<div class="tiles">'+
    '<div class="tile"><small>Goal</small><input id="g" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" aria-label="Daily goal"></div>'+
    '<div class="tile"><small>Streak</small><b id="st"></b></div>'+
    '<div class="tile"><small>All time</small><b id="al"></b></div>'+
  '</div>'+
  '<button class="undo" id="undo">Undo last</button>';
  var arc=$('arc');CIRC=2*Math.PI*((280-30)/2);
  $('zone').addEventListener('click',tap);
  $('undo').addEventListener('click',function(e){e.stopPropagation();bump(-1)});
  var gi=$('g');
  gi.addEventListener('input',function(){
    gi.value=gi.value.replace(/\D/g,'');
    var v=parseInt(gi.value,10);
    if(v>0){S.goal=v;save();updDay()}
  });
  gi.addEventListener('blur',function(){gi.value=S.goal});
  gi.addEventListener('keydown',function(e){if(e.key==='Enter')gi.blur()});
  gi.addEventListener('focus',function(){gi.select()});
  updDay();
}
function updDay(){
  var n=cnt(TODAY),p=S.goal?n/S.goal:0,arc=$('arc');
  if(!arc)return;
  arc.style.strokeDashoffset=CIRC*(1-Math.min(p,1));
  arc.style.opacity=n>0?1:0;
  $('num').textContent=fmt(n);
  $('of').textContent='of '+fmt(S.goal);
  $('ok').textContent=n>=S.goal?'Goal reached':'';
  if(document.activeElement!==$('g'))$('g').value=S.goal;
  $('st').textContent=streak()+(streak()===1?' day':' days');
  $('al').textContent=fmt(total());
}
function bump(d){
  var k=key(TODAY),n=Math.max(0,(S.days[k]||0)+d);
  if(n===0)delete S.days[k];else S.days[k]=n;
  save();updDay();push();
}
function tap(){
  bump(1);
  var b=$('br');b.classList.add('p');setTimeout(function(){b.classList.remove('p')},90);
  try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}
}
function setGoal(d){S.goal=Math.max(10,S.goal+d);save();updDay()}

/* ---------- WEEK ---------- */
function weekStart(){
  var idx=(TODAY.getDay()+1)%7;
  return addDays(TODAY,-idx+off*7);
}
function renderWeek(){
  var s=weekStart(),e=addDays(s,6),days=[],tot=0,best=0,met=0,elapsed=0,mx=1;
  for(var i=0;i<7;i++){
    var d=addDays(s,i),n=cnt(d);days.push({d:d,n:n});
    tot+=n;if(n>best)best=n;if(S.goal&&n>=S.goal)met++;if(d<=TODAY)elapsed++;if(n>mx)mx=n;
  }
  mx=Math.max(mx,S.goal);
  var label=off===0?'This week':MN[s.getMonth()].slice(0,3)+' '+s.getDate()+' – '+MN[e.getMonth()].slice(0,3)+' '+e.getDate();
  var h='<div class="nav"><button id="pv" aria-label="Previous week">‹</button><span>'+label+'</span><button id="nx" aria-label="Next week"'+(off>=0?' style="visibility:hidden"':'')+'>›</button></div>'+
  '<div class="card"><div class="big">'+fmt(tot)+'<small>istighfar</small></div><div class="wk" style="margin-top:14px">';
  days.forEach(function(x,i){
    h+='<div class="d'+(key(x.d)===key(TODAY)?' today':'')+'"><span class="l">'+WD[i]+'</span>'+ring(S.goal?x.n/S.goal:0,38,6)+'<span class="c">'+fmt(x.n)+'</span></div>';
  });
  h+='</div></div><div class="card"><div class="bars">';
  days.forEach(function(x){h+='<div class="'+(x.n?'':'z')+'" style="height:'+Math.round(x.n/mx*100)+'%"></div>'});
  h+='</div></div><div class="sum">'+
  '<div class="tile"><small>Daily average</small><b>'+fmt(Math.round(tot/Math.max(1,off===0?elapsed:7)))+'</b></div>'+
  '<div class="tile"><small>Best day</small><b>'+fmt(best)+'</b></div>'+
  '<div class="tile"><small>Goals reached</small><b>'+met+' of 7</b></div>'+
  '<div class="tile"><small>Streak</small><b>'+streak()+' days</b></div></div>';
  $('content').innerHTML=h;
  $('pv').onclick=function(){off--;render()};
  $('nx').onclick=function(){off++;render()};
}

/* ---------- MONTH ---------- */
function renderMonth(){
  var f=new Date(TODAY.getFullYear(),TODAY.getMonth()+off,1),dim=new Date(f.getFullYear(),f.getMonth()+1,0).getDate();
  var lead=(f.getDay()+1)%7,tot=0,best=0,met=0,elapsed=0,cells='';
  ['Sa','Su','Mo','Tu','We','Th','Fr'].forEach(function(w){cells+='<div class="h">'+w+'</div>'});
  for(var i=0;i<lead;i++)cells+='<div></div>';
  for(var d=1;d<=dim;d++){
    var dt=new Date(f.getFullYear(),f.getMonth(),d),n=cnt(dt),fut=dt>TODAY;
    tot+=n;if(n>best)best=n;if(S.goal&&n>=S.goal)met++;if(!fut)elapsed++;
    cells+='<div class="d'+(key(dt)===key(TODAY)?' today':'')+(fut?' fut':'')+'">'+ring(S.goal?n/S.goal:0,36,5)+'<span>'+d+'</span></div>';
  }
  var h='<div class="nav"><button id="pv" aria-label="Previous month">‹</button><span>'+MN[f.getMonth()]+' '+f.getFullYear()+'</span><button id="nx" aria-label="Next month"'+(off>=0?' style="visibility:hidden"':'')+'>›</button></div>'+
  '<div class="card"><div class="big">'+fmt(tot)+'<small>istighfar</small></div></div>'+
  '<div class="card"><div class="cal">'+cells+'</div></div>'+
  '<div class="sum">'+
  '<div class="tile"><small>Daily average</small><b>'+fmt(Math.round(tot/Math.max(1,elapsed)))+'</b></div>'+
  '<div class="tile"><small>Best day</small><b>'+fmt(best)+'</b></div>'+
  '<div class="tile"><small>Goals reached</small><b>'+met+' days</b></div>'+
  '<div class="tile"><small>Streak</small><b>'+streak()+' days</b></div></div>';
  $('content').innerHTML=h;
  $('pv').onclick=function(){off--;render()};
  $('nx').onclick=function(){off++;render()};
}

function render(){
  if(view==='day')renderDay();else if(view==='week')renderWeek();else if(view==='month')renderMonth();else renderFriends();
}
$('date').textContent=TODAY.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
$('tabs').addEventListener('click',function(e){
  var v=e.target.getAttribute&&e.target.getAttribute('data-v');
  if(!v||v===view)return;
  view=v;off=0;
  Array.prototype.forEach.call($('tabs').children,function(b){b.classList.toggle('on',b.getAttribute('data-v')===v)});
  render();
});

/* ---------- ONLINE (Supabase) ---------- */
var SB=null,ME=null,PROF=null,RANGE='today',AM='in',pt=null;
try{SB=supabase.createClient('https://rfnxlolvnkgqwpsbcbzg.supabase.co','sb_publishable_jqB0kvywuWsKArOVYxz9_A_e8x8b8kS')}catch(e){}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function msg(t){var m=$('msg');if(m)m.textContent=t||''}
function push(now){
  if(!SB||!ME)return Promise.resolve();
  clearTimeout(pt);
  var go=function(){return SB.from('daily_counts').upsert({user_id:ME.id,day:key(TODAY),count:cnt(TODAY)})};
  if(now)return go();
  pt=setTimeout(go,800);return Promise.resolve();
}
async function loadProf(){var r=await SB.from('profiles').select('username').eq('id',ME.id).maybeSingle();PROF=r.data}
async function sync(){
  var r=await SB.from('daily_counts').select('day,count'),rem={},up=[],k;
  (r.data||[]).forEach(function(x){rem[x.day]=x.count});
  for(k in rem)if(rem[k]>(S.days[k]||0))S.days[k]=rem[k];
  for(k in S.days)if(S.days[k]>(rem[k]||0))up.push({user_id:ME.id,day:k,count:S.days[k]});
  if(up.length)await SB.from('daily_counts').upsert(up);
  save();
}
async function init(){
  if(!SB)return;
  try{
    var s=(await SB.auth.getSession()).data.session;
    if(s){ME=s.user;await loadProf();await sync();if(view==='day')updDay();else render()}
  }catch(e){}
}
async function saveName(un){
  if(!/^[a-z0-9_]{3,20}$/.test(un)){msg('Username: 3-20 letters, numbers or _');return false}
  var p=await SB.from('profiles').insert({id:ME.id,username:un});
  if(p.error){msg(p.error.code==='23505'?'Username already taken':p.error.message);return false}
  PROF={username:un};return true;
}
function renderFriends(){
  if(!SB){$('content').innerHTML='<div class="card">Online features are unavailable right now.</div>';return}
  if(!ME)return authView();
  if(!PROF)return nameView();
  groupsView();
}
function authView(){
  var up=AM==='up';
  $('content').innerHTML='<div class="card"><b style="font-size:22px">'+(up?'Create account':'Sign in')+'</b><p class="sub">Sync your counts and compete with friends.</p>'+
  (up?'<input class="f" id="un" placeholder="Username" maxlength="20" autocapitalize="none" autocomplete="off">':'')+
  '<input class="f" id="em" type="email" placeholder="Email" autocapitalize="none"><input class="f" id="pw" type="password" placeholder="Password (min 6)">'+
  '<button class="pb" id="go">'+(up?'Sign up':'Sign in')+'</button><div class="ok" id="msg"></div>'+
  '<button class="lk" id="sw">'+(up?'Have an account? Sign in':'New here? Create account')+'</button></div>';
  $('sw').onclick=function(){AM=up?'in':'up';authView()};
  $('go').onclick=async function(){
    var em=$('em').value.trim(),pw=$('pw').value,un=up?$('un').value.trim().toLowerCase():'',r;
    if(up&&!/^[a-z0-9_]{3,20}$/.test(un))return msg('Username: 3-20 letters, numbers or _');
    msg('Please wait...');
    if(up){
      r=await SB.auth.signUp({email:em,password:pw});
      if(r.error)return msg(r.error.message);
      if(!r.data.session)return msg('Check your email to confirm, then sign in.');
      ME=r.data.user;
      if(!(await saveName(un)))return nameView('That username is taken. Pick another.');
    }else{
      r=await SB.auth.signInWithPassword({email:em,password:pw});
      if(r.error)return msg(r.error.message);
      ME=r.data.user;await loadProf();
    }
    await sync();render();
  };
}
function nameView(note){
  $('content').innerHTML='<div class="card"><b style="font-size:22px">Choose a username</b><p class="sub">Friends will see this on the leaderboard.</p><input class="f" id="un" maxlength="20" autocapitalize="none" placeholder="Username"><button class="pb" id="sv">Save</button><div class="ok" id="msg">'+esc(note||'')+'</div></div>';
  $('sv').onclick=async function(){if(await saveName($('un').value.trim().toLowerCase())){await sync();render()}};
}
function rng(){
  var y=TODAY.getFullYear(),m=TODAY.getMonth();
  if(RANGE==='today')return[key(TODAY),key(TODAY)];
  if(RANGE==='week'){var s=addDays(TODAY,-((TODAY.getDay()+1)%7));return[key(s),key(addDays(s,6))]}
  return[key(new Date(y,m,1)),key(new Date(y,m+1,0))];
}
async function groupsView(){
  await push(true);
  var g=(await SB.from('groups').select('id,name,code').order('name')).data||[];
  $('content').innerHTML='<div class="nav"><span>@'+esc(PROF.username)+'</span><button class="lk" id="so">Sign out</button></div>'+
  '<div class="tabs" id="rg">'+['today','week','month'].map(function(x){return'<button data-r="'+x+'"'+(x===RANGE?' class="on"':'')+'>'+x[0].toUpperCase()+x.slice(1)+'</button>'}).join('')+'</div><div id="lbs"></div>'+
  '<div class="card"><b>Create a group</b><div class="row"><input class="f" id="gn" placeholder="Group name" maxlength="30"><button class="pb" id="gc">Create</button></div>'+
  '<b style="display:block;margin-top:14px">Join with a code</b><div class="row"><input class="f" id="gj" placeholder="Code" maxlength="10" autocapitalize="none"><button class="pb" id="gjb">Join</button></div><div class="ok" id="msg"></div></div>';
  $('so').onclick=async function(){await SB.auth.signOut();ME=null;PROF=null;S.days={};save();render()};
  $('rg').onclick=function(e){var r=e.target.getAttribute('data-r');if(r){RANGE=r;groupsView()}};
  $('gc').onclick=async function(){var n=$('gn').value.trim();if(!n)return;var r=await SB.rpc('create_group',{gname:n});if(r.error)msg(r.error.message);else groupsView()};
  $('gjb').onclick=async function(){var c=$('gj').value.trim().toLowerCase();if(!c)return;var r=await SB.rpc('join_group',{gcode:c});if(r.error)msg(r.error.message);else groupsView()};
  var box=$('lbs'),R=rng();
  if(!g.length){box.innerHTML='<div class="card sub">No groups yet. Create one and share its code with friends.</div>';return}
  for(var i=0;i<g.length;i++){
    var r=await SB.rpc('leaderboard',{gid:g[i].id,d1:R[0],d2:R[1]}),rows=r.data||[];
    var h='<div class="card"><div class="nav" style="margin:0 0 6px"><b>'+esc(g[i].name)+'</b><span class="sub" style="margin:0">Code: '+esc(g[i].code)+'</span></div>';
    rows.forEach(function(x,j){h+='<div class="lb'+(x.username===PROF.username?' me':'')+'"><span>'+(j+1)+'. '+esc(x.username)+'</span><span>'+fmt(Number(x.total))+'</span></div>'});
    h+='<button class="lk" data-leave="'+g[i].id+'">Leave group</button></div>';
    box.insertAdjacentHTML('beforeend',h);
  }
  box.onclick=async function(e){var id=e.target.getAttribute('data-leave');if(id){await SB.from('group_members').delete().eq('group_id',id).eq('user_id',ME.id);groupsView()}};
}
render();init();
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js")}catch(e){}}
</script>
</body>
</html>
