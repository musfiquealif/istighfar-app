<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dhikr Ring">
<meta name="theme-color" content="#0a0e0d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Dhikr Ring</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#f2f2f7;--text:#000;--sub:#8a8a8e;--ring:#12b886;--track:#12b88626;--bar:#12b886;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0e0d;--card:#151b19;--text:#fff;--sub:#8e8e93;--ring:#2de2a6;--track:#2de2a62e;--bar:#2de2a6}}
:root[data-theme="dark"]{--bg:#0a0e0d;--card:#151b19;--text:#fff;--sub:#8e8e93;--ring:#2de2a6;--track:#2de2a62e;--bar:#2de2a6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;min-height:100%}
#app{max-width:480px;margin:0 auto;padding:16px 18px 32px;min-height:100vh;display:flex;flex-direction:column}
h1{font-size:32px;margin:6px 0 2px;font-weight:700;letter-spacing:-.5px;text-align:center}
.date{color:var(--sub);font-size:15px;margin-bottom:16px;text-align:center}
.tabs{display:flex;background:var(--card);border-radius:20px;padding:3px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:none;color:var(--sub);font-weight:600;font-size:13px;font-family:inherit;padding:8px 0;border-radius:17px;cursor:pointer;transition:background .15s,color .15s}
.tabs button.on{background:var(--ring);color:#04130e}
.tapzone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0 18px;cursor:pointer;touch-action:manipulation}
.bigring{position:relative;width:280px;height:280px;transition:transform .12s}
.bigring.p{transform:scale(.97)}
.bigring svg{display:block;filter:drop-shadow(0 0 18px var(--track))}
.arc{transition:stroke-dashoffset .35s cubic-bezier(.3,.9,.3,1)}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.num{font-size:80px;font-weight:700;letter-spacing:-2px;font-variant-numeric:tabular-nums;line-height:1}
.of{color:var(--sub);font-size:15px;margin-top:6px}
.ar{font-family:Amiri,"Noto Naskh Arabic","Geeza Pro",serif;font-size:34px;margin-top:22px;color:var(--ring);direction:rtl}
.hint{color:var(--sub);font-size:13px;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border-radius:16px;padding:12px;text-align:center}
.tile small{display:block;color:var(--sub);font-size:12px;font-weight:600;margin-bottom:4px}
.tile b{font-size:22px;font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;justify-content:space-between}
.step button,.undo,.nav button{border:0;background:var(--track);color:var(--ring);width:28px;height:28px;border-radius:14px;font-weight:700;font-size:18px;font-family:inherit;cursor:pointer;line-height:1}
.undo{width:auto;padding:0 14px;height:36px;border-radius:18px;font-size:14px;font-weight:600;margin:12px auto 0;display:block}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav span{font-weight:600;font-size:17px}
.big{font-size:44px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums;text-align:center}
.big small{font-size:16px;color:var(--sub);font-weight:600;letter-spacing:0;margin-left:4px}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;text-align:center}
.card>.pb{width:100%}.card>.lk{display:block;margin:6px auto 0}
.lb span:first-child{text-align:left}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wk .d{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--sub);font-weight:600}
.wk .d.today .l{color:var(--ring)}
.wk .c{font-size:12px;color:var(--text);font-variant-numeric:tabular-nums}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:120px;align-items:end;margin-top:6px}
.bars div{background:var(--bar);border-radius:6px;min-height:4px;opacity:.9}
.bars div.z{background:var(--track)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 2px;justify-items:center}
.cal .h{font-size:11px;color:var(--sub);font-weight:600}
.cal .d{position:relative;width:36px;height:36px}
.cal .d span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.cal .d.today span{color:var(--ring)}
.cal .d.fut{opacity:.35}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum .tile b{font-size:20px}
.f{width:100%;padding:12px;border-radius:12px;border:0;background:var(--bg);color:var(--text);font-size:16px;font-family:inherit;margin:6px 0;user-select:text;-webkit-user-select:text;outline:0}
.pb{background:var(--ring);color:#04130e;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;font-family:inherit;cursor:pointer;margin-top:6px}
.lk{background:none;border:0;color:var(--ring);font-weight:600;font-size:14px;font-family:inherit;cursor:pointer;padding:6px 0}
.row{display:flex;gap:8px;align-items:center}.row .pb{margin-top:0;flex:none}
.lb{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--track);font-variant-numeric:tabular-nums}.lb.me{color:var(--ring);font-weight:700}
.sub{color:var(--sub);font-size:14px;margin:4px 0 10px}
.ok{color:var(--ring);font-size:14px;font-weight:600;margin-top:8px;min-height:18px;text-align:center}
.tile input{width:100%;text-align:center;font-weight:700;font-size:22px;font-family:inherit;color:var(--ring);background:none;border:0;border-bottom:2px solid var(--track);padding:0 0 2px;outline:0;border-radius:0;user-select:text;-webkit-user-select:text;font-variant-numeric:tabular-nums}
.tile input:focus{border-bottom-color:var(--ring)}
@media (prefers-reduced-motion:reduce){.arc,.bigring{transition:none}}
/* ---------- REELS (always dark, one mint colour, everything centred) ---------- */
#reels{position:fixed;inset:0;z-index:50;background:#0a0e0d;color:#fff;display:none;--ring:#2de2a6;--rc:#2de2a6;--ri:#04130e;--rk:#151b19;--rk2:#222a27;--rs:#8e9a96}
body.reels-on{overflow:hidden}body.reels-on #reels{display:block}
.feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.reel{position:relative;height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;background:radial-gradient(120% 60% at 50% 38%,#2de2a61c 0%,#2de2a600 60%),#0a0e0d}
.rbody{width:100%;max-width:520px;padding:calc(84px + env(safe-area-inset-top,0px)) 28px calc(170px + env(safe-area-inset-bottom,0px));text-align:center;display:flex;flex-direction:column;align-items:center}
.rref{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.2px;color:var(--rc);background:#2de2a614;border:1px solid #2de2a640;border-radius:16px;padding:6px 14px}
.rsub{font-size:13px;color:var(--rs);margin-top:8px}.rsub .ra{font-family:Amiri,"Noto Naskh Arabic",serif;font-size:16px}
.rbis{font-family:Amiri,"Noto Naskh Arabic","Geeza Pro",serif;font-size:22px;color:#ffffffb3;margin-top:18px;direction:rtl}
.rtxt{width:100%;max-height:calc(100vh - 400px);max-height:calc(100dvh - 400px);overflow-y:auto;margin-top:22px;overscroll-behavior:contain;scrollbar-width:none}
.rtxt::-webkit-scrollbar{display:none}
.rar{font-family:Amiri,"Noto Naskh Arabic","Geeza Pro",serif;direction:rtl;line-height:1.95}
.rar.xl{font-size:40px}.rar.l{font-size:31px}.rar.m{font-size:25px}.rar.s{font-size:21px}
.rdv{width:40px;height:3px;border-radius:2px;background:var(--rc);opacity:.7;margin:20px auto}
.ren{font-size:17px;line-height:1.6;color:#ffffffd9;max-width:360px;margin:0 auto}.ren.s{font-size:14px}
.rpos{margin-top:24px;width:150px;font-size:12px;color:var(--rs)}
.rpos i{display:block;height:4px;border-radius:2px;background:#2de2a61f;margin-top:8px;overflow:hidden}
.rpos i b{display:block;height:100%;background:var(--rc);border-radius:2px}
.ract{position:absolute;left:0;right:0;bottom:calc(50px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:flex-end;gap:12px;z-index:1}
.ract button{background:none;border:0;color:var(--rs);display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:11px;font-family:inherit;cursor:pointer;padding:0;width:54px}
.ract .c{width:48px;height:48px;border-radius:24px;background:var(--rk);display:flex;align-items:center;justify-content:center}
.ract svg{width:22px;height:22px;fill:#fff}
.ract button.on{color:var(--rc)}.ract button.on svg{fill:var(--rc)}
.ract .main{color:var(--rc);width:72px}
.ract .main .c{width:68px;height:68px;border-radius:34px;background:var(--rc);box-shadow:0 0 0 6px #2de2a61f,0 8px 24px #2de2a640}
.ract .main svg{width:30px;height:30px;fill:var(--ri)}
.rhint{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;color:#ffffff59;pointer-events:none}
.heart{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;pointer-events:none;opacity:0;fill:var(--rc);filter:drop-shadow(0 4px 16px #2de2a666)}
.heart.go{animation:pop .85s ease}
@keyframes pop{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(1.15)}30%{transform:scale(.95)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1) translateY(-40px)}}
.rtop{position:absolute;top:0;left:0;right:0;z-index:2;display:grid;grid-template-columns:56px 1fr 56px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 16px;background:linear-gradient(#0a0e0d,#0a0e0d00);pointer-events:none}
.rtop>*{pointer-events:auto}
.ib{width:40px;height:40px;border-radius:20px;border:0;background:#ffffff10;color:#fff;font-size:16px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;padding:0}
.rmode{justify-self:center;display:flex;background:var(--rk);border-radius:20px;padding:3px}
.rmode button{background:none;border:0;color:var(--rs);font-weight:600;font-size:14px;font-family:inherit;padding:7px 16px;border-radius:17px;cursor:pointer}
.rmode button.on{background:var(--rc);color:var(--ri)}
.pill{justify-self:end;font-size:10px;font-weight:800;letter-spacing:.6px;color:var(--rc);background:none;border:1.5px solid #2de2a666;border-radius:20px;height:28px;padding:0 9px;cursor:pointer;font-family:inherit}
.pill.on{background:var(--rc);border-color:var(--rc);color:var(--ri)}
.spin{width:34px;height:34px;border:3px solid #2de2a626;border-top-color:var(--rc);border-radius:50%;animation:sp .8s linear infinite;margin:auto}
@keyframes sp{to{transform:rotate(360deg)}}
.rerr{color:#ffffffd9;font-size:15px}.rerr .pb{display:block;margin:14px auto 0}
#rdim{position:absolute;inset:0;background:#000a;z-index:3;display:none}#rdim.open{display:block}
#rsheet{position:absolute;left:0;right:0;bottom:0;height:82%;max-width:560px;margin:0 auto;background:var(--rk);border-radius:22px 22px 0 0;z-index:4;transform:translateY(105%);transition:transform .25s ease;display:flex;flex-direction:column;padding:10px 16px calc(6px + env(safe-area-inset-bottom,0px))}
#rsheet:before{content:"";width:40px;height:5px;border-radius:3px;background:#ffffff26;margin:0 auto 10px}
#rsheet.open{transform:none}
.rst{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.rst button{background:var(--rk2);border:0;color:var(--rs);border-radius:17px;padding:7px 16px;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer}
.rst button.on{background:var(--rc);color:var(--ri)}
.rst .lk{margin-left:auto;background:none;color:var(--rc)}
#rsheet .f{background:var(--rk2);color:#fff;text-align:left}
.rlist{flex:1;overflow-y:auto;overscroll-behavior:contain}.rlist .sub{text-align:center;margin-top:16px}
.rli{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid #2de2a61a;cursor:pointer}
.rli small{display:block;color:var(--rs);font-size:12px;margin-top:2px}
.rli .a{font-family:Amiri,"Noto Naskh Arabic",serif;font-size:20px;color:var(--rc)}
.rcred{font-size:11px;color:var(--rs);padding:10px 2px 4px;line-height:1.5;text-align:center}.rcred a{color:var(--rc)}
#rtoast{position:absolute;left:50%;bottom:calc(170px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--rc);color:var(--ri);font-weight:700;font-size:14px;padding:9px 16px;border-radius:20px;z-index:5;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#rtoast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.heart.go{animation:none}#rsheet{transition:none}}
</style>
</head>
<body>
<div id="app">
  <h1>Dhikr Ring</h1>
  <div class="date" id="date"></div>
  <div class="tabs" id="tabs">
    <button data-v="day" class="on">Day</button><button data-v="week">Week</button><button data-v="month">Month</button><button data-v="reels">Reels</button><button data-v="friends">Friends</button>
  </div>
  <div id="content" style="flex:1;display:flex;flex-direction:column"></div>
</div>
<script>
var K='istighfar-v1',S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S&&S.days?S:{days:{},goal:100};
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function pad(n){return String(n).padStart(2,'0')}
function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function cnt(d){return S.days[key(d)]||0}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
var TODAY=new Date();TODAY.setHours(0,0,0,0);
// If the app stays open past midnight, move "today" forward (returns true if it changed)
function newDay(){var d=new Date();d.setHours(0,0,0,0);if(d.getTime()===TODAY.getTime())return false;TODAY=d;var h=document.getElementById('date');if(h)h.textContent=TODAY.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});return true}
var view='day',off=0;
var WD=['Sat','Sun','Mon','Tue','Wed','Thu','Fri'];
var MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
var $=function(id){return document.getElementById(id)};
function fmt(n){return n.toLocaleString('en-US')}

function ring(p,sz,sw){
  var r=(sz-sw)/2,c=2*Math.PI*r,h=sz/2;
  return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 '+sz+' '+sz+'">'+
  '<circle cx="'+h+'" cy="'+h+'" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="'+sw+'"/>'+
  '<circle class="arc" id="'+(sz>200?'arc':'')+'" cx="'+h+'" cy="'+h+'" r="'+r+'" fill="none" stroke="var(--ring)" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-Math.min(p,1)))+'" transform="rotate(-90 '+h+' '+h+')" opacity="'+(p>0?1:0)+'"/></svg>';
}
function streak(){
  var n=0,d=new Date(TODAY);
  if(cnt(d)<S.goal)d=addDays(d,-1);
  while(cnt(d)>=S.goal&&S.goal>0){n++;d=addDays(d,-1)}
  return n;
}
function total(){var t=0;for(var k in S.days)t+=S.days[k];return t}

/* ---------- DAY ---------- */
var CIRC=0;
function renderDay(){
  $('content').innerHTML=
  '<div class="tapzone" id="zone">'+
    '<div class="bigring" id="br">'+ring(0,280,30)+
      '<div class="center"><div class="num" id="num">0</div><div class="of" id="of"></div></div></div>'+
    '<div class="ar">أَسْتَغْفِرُ ٱللَّٰهَ</div>'+
    '<div class="ok" id="ok"></div>'+
    '<div class="hint">Tap anywhere to count</div>'+
  '</div>'+
  '<div class="tiles">'+
    '<div class="tile"><small>Goal</small><input id="g" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" aria-label="Daily goal"></div>'+
    '<div class="tile"><small>Streak</small><b id="st"></b></div>'+
    '<div class="tile"><small>All time</small><b id="al"></b></div>'+
  '</div>'+
  '<button class="undo" id="undo">Undo last</button>';
  var arc=$('arc');CIRC=2*Math.PI*((280-30)/2);
  $('zone').addEventListener('click',tap);
  $('undo').addEventListener('click',function(e){e.stopPropagation();bump(-1)});
  var gi=$('g');
  gi.addEventListener('input',function(){
    gi.value=gi.value.replace(/\D/g,'');
    var v=parseInt(gi.value,10);
    if(v>0){S.goal=v;save();updDay()}
  });
  gi.addEventListener('blur',function(){gi.value=S.goal});
  gi.addEventListener('keydown',function(e){if(e.key==='Enter')gi.blur()});
  gi.addEventListener('focus',function(){gi.select()});
  updDay();
}
function updDay(){
  var n=cnt(TODAY),p=S.goal?n/S.goal:0,arc=$('arc');
  if(!arc)return;
  arc.style.strokeDashoffset=CIRC*(1-Math.min(p,1));
  arc.style.opacity=n>0?1:0;
  $('num').textContent=fmt(n);
  $('of').textContent='of '+fmt(S.goal);
  $('ok').textContent=n>=S.goal?'Goal reached':'';
  if(document.activeElement!==$('g'))$('g').value=S.goal;
  $('st').textContent=streak()+(streak()===1?' day':' days');
  $('al').textContent=fmt(total());
}
function bump(d){
  if(newDay()&&d<0)return updDay();
  var k=key(TODAY),n=Math.max(0,(S.days[k]||0)+d);
  if(n===0)delete S.days[k];else S.days[k]=n;
  save();updDay();push();
}
function tap(){
  bump(1);
  var b=$('br');b.classList.add('p');setTimeout(function(){b.classList.remove('p')},90);
  try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}
}
function setGoal(d){S.goal=Math.max(10,S.goal+d);save();updDay()}

/* ---------- WEEK ---------- */
function weekStart(){
  var idx=(TODAY.getDay()+1)%7;
  return addDays(TODAY,-idx+off*7);
}
function renderWeek(){
  var s=weekStart(),e=addDays(s,6),days=[],tot=0,best=0,met=0,elapsed=0,mx=1;
  for(var i=0;i<7;i++){
    var d=addDays(s,i),n=cnt(d);days.push({d:d,n:n});
    tot+=n;if(n>best)best=n;if(S.goal&&n>=S.goal)met++;if(d<=TODAY)elapsed++;if(n>mx)mx=n;
  }
  mx=Math.max(mx,S.goal);
  var label=off===0?'This week':MN[s.getMonth()].slice(0,3)+' '+s.getDate()+' – '+MN[e.getMonth()].slice(0,3)+' '+e.getDate();
  var h='<div class="nav"><button id="pv" aria-label="Previous week">‹</button><span>'+label+'</span><button id="nx" aria-label="Next week"'+(off>=0?' style="visibility:hidden"':'')+'>›</button></div>'+
  '<div class="card"><div class="big">'+fmt(tot)+'<small>istighfar</small></div><div class="wk" style="margin-top:14px">';
  days.forEach(function(x,i){
    h+='<div class="d'+(key(x.d)===key(TODAY)?' today':'')+'"><span class="l">'+WD[i]+'</span>'+ring(S.goal?x.n/S.goal:0,38,6)+'<span class="c">'+fmt(x.n)+'</span></div>';
  });
  h+='</div></div><div class="card"><div class="bars">';
  days.forEach(function(x){h+='<div class="'+(x.n?'':'z')+'" style="height:'+Math.round(x.n/mx*100)+'%"></div>'});
  h+='</div></div><div class="sum">'+
  '<div class="tile"><small>Daily average</small><b>'+fmt(Math.round(tot/Math.max(1,off===0?elapsed:7)))+'</b></div>'+
  '<div class="tile"><small>Best day</small><b>'+fmt(best)+'</b></div>'+
  '<div class="tile"><small>Goals reached</small><b>'+met+' of 7</b></div>'+
  '<div class="tile"><small>Streak</small><b>'+streak()+' days</b></div></div>';
  $('content').innerHTML=h;
  $('pv').onclick=function(){off--;render()};
  $('nx').onclick=function(){off++;render()};
}

/* ---------- MONTH ---------- */
function renderMonth(){
  var f=new Date(TODAY.getFullYear(),TODAY.getMonth()+off,1),dim=new Date(f.getFullYear(),f.getMonth()+1,0).getDate();
  var lead=(f.getDay()+1)%7,tot=0,best=0,met=0,elapsed=0,cells='';
  ['Sa','Su','Mo','Tu','We','Th','Fr'].forEach(function(w){cells+='<div class="h">'+w+'</div>'});
  for(var i=0;i<lead;i++)cells+='<div></div>';
  for(var d=1;d<=dim;d++){
    var dt=new Date(f.getFullYear(),f.getMonth(),d),n=cnt(dt),fut=dt>TODAY;
    tot+=n;if(n>best)best=n;if(S.goal&&n>=S.goal)met++;if(!fut)elapsed++;
    cells+='<div class="d'+(key(dt)===key(TODAY)?' today':'')+(fut?' fut':'')+'">'+ring(S.goal?n/S.goal:0,36,5)+'<span>'+d+'</span></div>';
  }
  var h='<div class="nav"><button id="pv" aria-label="Previous month">‹</button><span>'+MN[f.getMonth()]+' '+f.getFullYear()+'</span><button id="nx" aria-label="Next month"'+(off>=0?' style="visibility:hidden"':'')+'>›</button></div>'+
  '<div class="card"><div class="big">'+fmt(tot)+'<small>istighfar</small></div></div>'+
  '<div class="card"><div class="cal">'+cells+'</div></div>'+
  '<div class="sum">'+
  '<div class="tile"><small>Daily average</small><b>'+fmt(Math.round(tot/Math.max(1,elapsed)))+'</b></div>'+
  '<div class="tile"><small>Best day</small><b>'+fmt(best)+'</b></div>'+
  '<div class="tile"><small>Goals reached</small><b>'+met+' days</b></div>'+
  '<div class="tile"><small>Streak</small><b>'+streak()+' days</b></div></div>';
  $('content').innerHTML=h;
  $('pv').onclick=function(){off--;render()};
  $('nx').onclick=function(){off++;render()};
}

function render(){
  if(view==='day')renderDay();else if(view==='week')renderWeek();else if(view==='month')renderMonth();else if(view==='reels')openReels();else renderFriends();
}
$('date').textContent=TODAY.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
$('tabs').addEventListener('click',function(e){
  var v=e.target.getAttribute&&e.target.getAttribute('data-v');
  if(!v||v===view)return;
  view=v;off=0;
  Array.prototype.forEach.call($('tabs').children,function(b){b.classList.toggle('on',b.getAttribute('data-v')===v)});
  render();
});

try{SB=supabase.createClient('https://rfnxlolvnkgqwpsbcbzg.supabase.co','sb_publishable_jqB0kvywuWsKArOVYxz9_A_e8x8b8kS')}catch(e){}

function push(now){
  if(!SB||!ME)return Promise.resolve();
  clearTimeout(pt);
  var uid=ME.id,day=key(TODAY);
  var go=function(){return SB.from('daily_counts').upsert({user_id:uid,day:day,count:S.days[day]||0})};
  if(now)return go();
  pt=setTimeout(go,800);return Promise.resolve();
}
async function loadProf(){var r=await SB.from('profiles').select('username').eq('id',ME.id).maybeSingle();PROF=r.data}
async function sync(){
  // Only my own rows, so friends' counts can never be merged into mine
  var r=await SB.from('daily_counts').select('day,count').eq('user_id',ME.id),rem={},up=[],k;
  if(r.error)throw r.error;
  (r.data||[]).forEach(function(x){rem[x.day]=x.count});
  for(k in rem)if(rem[k]>(S.days[k]||0))S.days[k]=rem[k];
  for(k in S.days)if(S.days[k]>(rem[k]||0))up.push({user_id:ME.id,day:k,count:S.days[k]});
  save();
  if(up.length){var u=await SB.from('daily_counts').upsert(up);if(u.error)throw u.error}
}
async function init(){
  if(!SB)return;
  try{
    var s=(await SB.auth.getSession()).data.session;
    if(s){ME=s.user;await loadProf();await sync();if(view==='day')updDay();else render()}

}

RS=Object.assign({mode:'random',pos:1,saved:[],auto:false},RS||{});

// One round action button with its label underneath
function rbtn(a,icon,label,cls){return '<button data-a="'+a+'" aria-label="'+label+'"'+(cls?' class="'+cls+'"':'')+'><span class="c">'+icon+'</span><span>'+label+'</span></button>'}

function qGet(n){
  if(QC[n])return Promise.resolve(QC[n]);
  return fetch(QAPI+'ayah/'+n+'/editions/quran-uthmani,en.pickthall,ar.alafasy').then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);return r.json();
  }).then(function(j){
    var a=j.data[0],e=j.data[1],au=j.data[2]||{},ar=String(a.text).replace(/^﻿/,'').trim(),bis='';
    // The source puts "Bismillah" at the start of each surah's first verse: show it as a header instead
    if(a.numberInSurah===1&&a.surah.number!==1){
      var w=ar.split(/\s+/);
      if(w.length>4&&w[0].replace(/[ً-ٰٟۖ-ۭ]/g,'').indexOf('بسم')===0){bis=w.slice(0,4).join(' ');ar=w.slice(4).join(' ')}
    }
    return QC[n]={n:n,ar:ar,bis:bis,en:e.text,s:a.surah.number,sn:a.surah.englishName,st:a.surah.englishNameTranslation,sa:a.surah.name,
      i:a.numberInSurah,of:a.surah.numberOfAyahs,au:au.audio||('https://cdn.islamic.network/quran/audio/128/ar.alafasy/'+n+'.mp3')};
  });
}
function buildReels(){
  if($('reels'))return;
  var d=document.createElement('div');d.id='reels';
  d.innerHTML='<div class="rtop"><button class="ib" id="rx" aria-label="Close">&#x2715;</button>'+
    '<div class="rmode" id="rmode"><button data-m="random">For you</button><button data-m="order">In order</button></div>'+
    '<button class="pill" id="rau" aria-label="Auto-play recitation">AUTO</button></div>'+
    '<div class="feed" id="feed"></div><div id="rdim"></div>'+
    '<div id="rsheet"><div class="rst"><button data-t="surahs">Surahs</button><button data-t="saved">Saved</button><button class="lk" id="rdone">Done</button></div>'+
    '<input class="f" id="rq" placeholder="Search surah name or number" autocomplete="off"><div class="rlist" id="rlist"></div>'+
    '<div class="rcred">Arabic text: <a href="https://tanzil.net" target="_blank" rel="noopener">Tanzil Project</a> (Uthmani). English: Marmaduke Pickthall (public domain). Recitation: Mishary Rashid Alafasy. Served by <a href="https://alquran.cloud" target="_blank" rel="noopener">AlQuran Cloud</a>.</div></div>'+
    '<div id="rtoast"></div>';
  document.body.appendChild(d);
  FD=$('feed');
  IO=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)activate(+e.target.getAttribute('data-i'))})},{root:FD,threshold:0.6});
  $('rx').onclick=function(){if(history.state&&history.state.reels)history.back();else closeReels()};
  $('rmode').onclick=function(e){var m=e.target.getAttribute('data-m');if(m&&m!==RS.mode){RS.mode=m;startFeed()}};
  $('rau').onclick=function(){RS.auto=!RS.auto;rsave();markTop();toast(RS.auto?'Auto-play on: recites and moves to the next verse':'Auto-play off');if(RS.auto&&!PLAYING&&ACT>=0)playReel(ACT)};
  $('rdone').onclick=$('rdim').onclick=closeSheet;
  $('rsheet').querySelector('.rst').addEventListener('click',function(e){var t=e.target.getAttribute('data-t');if(t)openSheet(t)});
  $('rq').oninput=renderSheet;
  $('rlist').onclick=function(e){var li=e.target.closest('[data-n]');if(li){closeSheet();RS.mode='order';startFeed(+li.getAttribute('data-n'))}};
  var lastTap=0,lastI=-1,tapT=null;
  FD.onclick=function(e){
    var r=e.target.closest('.reel');if(!r)return;
    var i=+r.getAttribute('data-i'),b=e.target.closest('[data-a]');
    if(b)return reelAction(b.getAttribute('data-a'),i,r);
    // One tap = play/pause recitation, two quick taps = save (like Instagram)
    var now=Date.now();
    if(now-lastTap<300&&lastI===i){clearTimeout(tapT);lastTap=0;like(i,true);burst(r);return}
    lastTap=now;lastI=i;tapT=setTimeout(function(){togglePlay(i)},300);
  };
}
function openReels(){
  buildReels();
  $('content').innerHTML='';
  if(document.body.classList.contains('reels-on'))return;
  document.body.classList.add('reels-on');
  try{history.pushState({reels:1},'')}catch(e){}
  markTop();
  if(!FEED.length)startFeed();
}
function closeReels(){
  if(!document.body.classList.contains('reels-on'))return;
  document.body.classList.remove('reels-on');
  stopAudio();closeSheet();
  view='day';
  Array.prototype.forEach.call($('tabs').children,function(b){b.classList.toggle('on',b.getAttribute('data-v')==='day')});
  render();
}
window.addEventListener('popstate',closeReels);
function markTop(){
  Array.prototype.forEach.call($('rmode').children,function(b){b.classList.toggle('on',b.getAttribute('data-m')===RS.mode)});
  $('rau').classList.toggle('on',RS.auto);
}
// n = global verse number (1-6236) to start from in "In order" mode
function startFeed(n){
  if(n){RS.mode='order';RS.pos=n}
  rsave();stopAudio();markTop();
  FEED=[];ACT=-1;SEEN={};NSEEN=0;IO.disconnect();FD.innerHTML='';FD.scrollTop=0;
  more(4);
}
function nextN(){
  if(RS.mode==='random'){
    if(NSEEN>QN-50){SEEN={};NSEEN=0}
    var n;do{n=1+Math.floor(Math.random()*QN)}while(SEEN[n]);
    SEEN[n]=1;NSEEN++;return n;
  }
  var last=FEED.length?FEED[FEED.length-1]:RS.pos-1;
  return last>=QN?1:last+1;
}
function more(k){
  for(var j=0;j<k;j++){
    var i=FEED.length,n=nextN(),el=document.createElement('section');
    FEED.push(n);
    el.className='reel';el.setAttribute('data-i',i);
    el.innerHTML='<div class="rbody"></div><div class="ract">'+
      rbtn('like',IC.like,'Save')+rbtn('share',IC.share,'Share')+rbtn('play',IC.play,'Listen','main')+
      rbtn('read',IC.read,'Read on')+rbtn('surahs',IC.list,'Surahs')+'</div>'+
      '<div class="rhint">Swipe up for the next verse</div>'+
      '<svg class="heart" viewBox="0 0 24 24"><path d="'+IC.like.match(/d="([^"]+)"/)[1]+'"/></svg>';
    FD.appendChild(el);IO.observe(el);loadReel(el,i);
  }
}
function loadReel(el,i){
  var body=el.querySelector('.rbody'),n=FEED[i];
  body.innerHTML='<div class="spin"></div>';
  qGet(n).then(function(q){
    if(!el.isConnected)return;
    var L=q.ar.length,sz=L<90?'xl':L<220?'l':L<500?'m':'s';
    body.innerHTML='<div class="rref">'+esc(q.sn)+' &middot; '+q.s+':'+q.i+'</div>'+
      '<div class="rsub">'+esc(q.st)+' &middot; <span class="ra">'+esc(q.sa)+'</span></div>'+
      (q.bis?'<div class="rbis" lang="ar">'+esc(q.bis)+'</div>':'')+
      '<div class="rtxt"><div class="rar '+sz+'" lang="ar" dir="rtl">'+esc(q.ar)+'</div><div class="rdv"></div><div class="ren'+(q.en.length>600?' s':'')+'">'+esc(q.en)+'</div></div>'+
      '<div class="rpos">Verse '+q.i+' of '+q.of+'<i><b style="width:'+Math.round(q.i/q.of*100)+'%"></b></i></div>';
    markLike(el,n);
    if(i===ACT&&RS.auto&&!PLAYING)playReel(i);
  }).catch(function(){
    if(!el.isConnected)return;
    body.innerHTML='<div class="rerr">Couldn’t load this verse.<br>Check your internet connection.<button class="pb" data-a="retry">Try again</button></div>';
  });
}
function activate(i){
  if(i===ACT)return;
  ACT=i;
  if(RS.mode==='order'){RS.pos=FEED[i];rsave()}
  stopAudio();
  if(RS.auto)playReel(i);
  if(i>=FEED.length-3)more(4);
}
function reelAction(a,i,r){
  if(a==='like')like(i,false);
  else if(a==='play')togglePlay(i);
  else if(a==='share')shareReel(i);
  else if(a==='read'){RS.mode='order';startFeed(FEED[i]);toast('Reading in order from here')}
  else if(a==='surahs')openSheet('surahs');
  else if(a==='retry')loadReel(r,i);
}
function isSaved(n){for(var k=0;k<RS.saved.length;k++)if(RS.saved[k].n===n)return k;return -1}
function markLike(el,n){var b=el.querySelector('[data-a=like]');if(b)b.classList.toggle('on',isSaved(n)>=0)}
function like(i,onlyAdd){
  var q=QC[FEED[i]];if(!q)return;
  var k=isSaved(q.n);
  if(k>=0){if(onlyAdd)return;RS.saved.splice(k,1)}
  else RS.saved.unshift({n:q.n,ref:q.sn+' '+q.s+':'+q.i,en:q.en.slice(0,90)});
  rsave();
  Array.prototype.forEach.call(FD.children,function(el){if(FEED[+el.getAttribute('data-i')]===q.n)markLike(el,q.n)});
}
function burst(r){var h=r.querySelector('.heart');h.classList.remove('go');void h.offsetWidth;h.classList.add('go')}
function shareReel(i){
  var q=QC[FEED[i]];if(!q)return;
  var t=q.ar+'\n\n'+q.en+'\n\n— Quran '+q.s+':'+q.i+' ('+q.sn+')';
  if(navigator.share)navigator.share({text:t}).catch(function(){});
  else if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast('Copied to clipboard')},function(){});
}
function markPlay(){
  if(!FD)return;
  Array.prototype.forEach.call(FD.querySelectorAll('[data-a=play]'),function(b){
    var on=PLAYING&&+b.closest('.reel').getAttribute('data-i')===ACT;
    b.innerHTML='<span class="c">'+(on?IC.pause:IC.play)+'</span><span>'+(on?'Pause':'Listen')+'</span>';
  });
}
function playReel(i){
  var q=QC[FEED[i]];if(!q)return;
  if(!AUD){
    AUD=new Audio();
    AUD.onended=function(){
      PLAYING=false;markPlay();
      if(RS.auto){var nx=FD.children[ACT+1];if(nx)nx.scrollIntoView({behavior:'smooth'})}
    };
    AUD.onerror=function(){PLAYING=false;markPlay();toast('Couldn’t play the recitation')};
  }
  if(AUD._n!==q.n){AUD.src=q.au;AUD._n=q.n}
  PLAYING=true;markPlay();
  var p=AUD.play();
  if(p&&p.catch)p.catch(function(){PLAYING=false;markPlay()});
}
function togglePlay(i){
  if(i!==ACT)return;
  if(PLAYING){AUD.pause();PLAYING=false;markPlay()}else playReel(i);
}
function stopAudio(){
  if(AUD){AUD.pause();try{AUD.currentTime=0}catch(e){}}
  PLAYING=false;markPlay();
}
var toastT=null;
function toast(t){var el=$('rtoast');if(!el)return;el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('on')},1800)}
function openSheet(t){
  SHEET=t;$('rq').value='';
  $('rq').style.display=t==='surahs'?'':'none';
  Array.prototype.forEach.call($('rsheet').querySelectorAll('[data-t]'),function(b){b.classList.toggle('on',b.getAttribute('data-t')===t)});
  $('rsheet').classList.add('open');$('rdim').classList.add('open');
  if(t==='surahs'&&!SURAHS)loadSurahs();
  renderSheet();
}
function closeSheet(){var s=$('rsheet');if(s){s.classList.remove('open');$('rdim').classList.remove('open')}}
function setSurahs(list){
  SURAHS=list;SOFF=[];
  for(var k=0,o=0;k<list.length;k++){SOFF[list[k].number]=o;o+=list[k].numberOfAyahs}
}
function loadSurahs(){
  try{var c=JSON.parse(localStorage.getItem('istighfar-surahs'));if(c&&c.length===114){setSurahs(c);return}}catch(e){}
  fetch(QAPI+'surah').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
    var list=j.data.map(function(s){return{number:s.number,name:s.name,englishName:s.englishName,englishNameTranslation:s.englishNameTranslation,numberOfAyahs:s.numberOfAyahs}});
    setSurahs(list);
    try{localStorage.setItem('istighfar-surahs',JSON.stringify(list))}catch(e){}
    renderSheet();
  }).catch(function(){if(SHEET==='surahs')$('rlist').innerHTML='<p class="sub">Couldn’t load the surah list. Check your connection and try again.</p>'});
}
function renderSheet(){
  var box=$('rlist'),h='';
  if(SHEET==='saved'){
    if(!RS.saved.length)h='<p class="sub">Nothing saved yet. Double-tap a verse or tap the heart to save it.</p>';
    RS.saved.forEach(function(s){h+='<div class="rli" data-n="'+s.n+'"><div><b>'+esc(s.ref)+'</b><small>'+esc(s.en||'')+'…</small></div></div>'});
    box.innerHTML=h;return;
  }
  if(!SURAHS){box.innerHTML='<div class="spin" style="margin-top:30px"></div>';return}
  var q=$('rq').value.trim().toLowerCase().replace(/[^a-z0-9]/g,'');
  SURAHS.forEach(function(s){
    if(q&&String(s.number)!==q&&(s.englishName+s.englishNameTranslation).toLowerCase().replace(/[^a-z0-9]/g,'').indexOf(q)<0)return;
    h+='<div class="rli" data-n="'+(SOFF[s.number]+1)+'"><div><b>'+s.number+'. '+esc(s.englishName)+'</b><small>'+esc(s.englishNameTranslation)+' &middot; '+s.numberOfAyahs+' verses</small></div><span class="a">'+esc(s.name)+'</span></div>';
  });
  box.innerHTML=h||'<p class="sub">No surah found.</p>';
}
// Computer keyboard: arrows to move between verses, space to play/pause
document.addEventListener('keydown',function(e){
  if(!document.body.classList.contains('reels-on')||e.target.tagName==='INPUT')return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();FD.scrollBy({top:(e.key==='ArrowDown'?1:-1)*FD.clientHeight,behavior:'smooth'})}
  else if(e.key===' '){e.preventDefault();if(ACT>=0)togglePlay(ACT)}
  else if(e.key==='Escape')$('rx').click();
});

// Coming back to the app on a new day: refresh the screen so "today" is correct
document.addEventListener('visibilitychange',function(){if(!document.hidden&&newDay())render()});
render();init();
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js")}catch(e){}}
</script>
